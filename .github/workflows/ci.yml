name: ResearchMind CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    # Disposable MongoDB for the integration tests (tests/*.integration.test.ts).
    # Without it those tests are skipped, not passed.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          # Node 20 is end-of-life; several dependencies (pdfjs-dist, openai,
          # concurrently) declare node >= 22, and local development uses 22.
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Backend Services
        run: |
          npx tsc --noEmit -p services/api-gateway
          npx tsc --noEmit -p services/auth-service
          npx tsc --noEmit -p services/workspace-service
          npx tsc --noEmit -p services/task-service
          npx tsc --noEmit -p services/document-service
          npx tsc --noEmit -p services/ai-service

      - name: Typecheck & Build Frontend
        run: |
          npm run build --workspace=frontend

      - name: Run Automated Test Suite
        env:
          TEST_MONGO_URI: mongodb://localhost:27017
        run: |
          npm test
