# ---------------------------------------------------------------------------
# Local development stack.
#
# Credentials are environment REFERENCES, not literals. The :- defaults keep an
# existing local setup working unchanged; override them in a root .env (which is
# gitignored) for anything that is not a throwaway dev database.
#
# These containers publish their ports on 0.0.0.0 -- do not run this compose
# file unmodified on a host reachable from an untrusted network.
# ---------------------------------------------------------------------------
version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: researchmind-mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7

    container_name: researchmind-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  mongo-express:
    image: mongo-express

    container_name: researchmind-mongo-express

    restart: unless-stopped

    depends_on:
      - mongodb

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-password}

      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-password}
      
volumes:
  mongodb_data:
  redis_data: